muted playsinline></video></div><h1>Mon Budget</h1></div></div><div class="controls"><button>↻ Rejouer</button><label>Essayer ma vidéo<input type="file" accept="video/*"></label></div></main><script>const frame=document.querySelector('.screen'),video=document.querySelector('video');let timer,reveal,url;function play(){clearTimeout(timer);clearTimeout(reveal);video.pause();frame.className='screen';void frame.offsetWidth;frame.classList.add('run');if(url){video.currentTime=0;video.play().catch(()=>{});reveal=setTimeout(()=>{if(!video.paused)frame.classList.add('playing')},700)}timer=setTimeout(()=>{frame.classList.add('done');video.pause()},2700)}document.querySelector('button').onclick=play;document.querySelector('input').onchange=e=>{const f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);video.src=url;play()};window.addEventListener('load',play)</script></html>
