/* Prévisions budgétaires */
.sim-chart{border:1px solid var(--line);border-radius:14px;background:#fbfdfb;padding:10px;margin:15px 0;overflow:hidden}
.sim-chart svg{display:block;width:100%;height:auto;max-height:260px}
.sim-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:13px 0}
.sim-kpis .panel{margin:0;min-width:0}
.sim-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.sim-table th,.sim-table td{padding:9px 7px;white-space:nowrap}
.sim-table input{width:112px;min-width:100px;padding:8px}
.sim-table td:first-child{font-weight:700}
.sim-table td:last-child{text-align:right}
.sim-negative{color:#a84035;font-weight:800}
.sim-positive{color:var(--forest);font-weight:750}
.sim-hint{margin:10px 0}
.sim-checkbox{display:inline-flex;align-items:center;gap:8px;font-weight:600;margin:12px 0}
.sim-checkbox input{width:17px;height:17px}
@media(max-width:700px){.sim-kpis{grid-template-columns:1fr 1fr}.sim-kpis .stat{font-size:19px}}
@media(max-width:420px){.sim-kpis{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0 0 16px}legend{font-weight:650;margin-bottom:8px}
.category-choices{display:flex;flex-wrap:wrap;gap:8px}.category-choices label{display:flex;align-items:center;gap:7px;border:1px solid #c8d8cb;border-radius:12px;padding:8px 12px;margin:0;cursor:pointer}.category-choices input{width:auto;margin:0;accent-color:#258159}.category-choices label:has(:checked){background:#e3f1e7;border-color:#258159}
:root{--surface:#fff;--ink:#152c25;--accent:#156754}
body{background:#f2f6f2;color:var(--ink);padding-bottom:calc(88px + env(safe-area-inset-bottom));font-family:system-ui,sans-serif}
header{position:static;background:#f2f6f2;border:0;padding:0}
.heading,.wrap{max-width:720px;margin-inline:auto;padding-inline:20px}
.heading{display:flex;justify-content:space-between;align-items:center;padding-block:18px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.045em;color:var(--ink)}
.mark{background:#156754;color:white;border-radius:11px;display:inline-grid;place-items:center;width:33px;height:33px;margin-right:5px}
.wrap{padding-top:6px}
#tabs{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:#fff;border:1px solid #dbe6de;border-radius:22px 22px 0 0;padding:7px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px #1736290d;margin:0}
#tabs button{display:grid;justify-items:center;gap:1px;border:0;background:none;border-radius:13px;color:#466157;font-size:12px;padding:5px 0;min-height:49px}
#tabs button span{font-size:23px;line-height:1}
#tabs button.active{background:#dcefe5;color:#125442;font-weight:800}
h2{letter-spacing:-.045em;margin:0;font-size:clamp(25px,6vw,34px)}
h3{letter-spacing:-.025em}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:0 0 14px}
.period-picker{color:#476258;font-size:12px;font-weight:650;margin:0}
.period-picker input{font-size:16px;padding:5px 9px;margin:2px 0 0;width:auto;max-width:100%;min-height:37px}
.hero{background:#164b3d;color:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 24px #164b3d22}
.hero .space{color:#e0f1e8;font-size:13px}
.hero-amount{font-size:clamp(34px,9vw,55px);letter-spacing:-.055em;font-weight:790;margin-top:10px;line-height:1.2;overflow-wrap:anywhere}
.hero .bar{background:#427c6b;margin-top:17px}.hero .bar>div{background:#b5efc5}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0 21px}
.metrics button,.budget-card,.panel,.entry{background:var(--surface);border:1px solid #dfeae1;border-radius:17px;box-shadow:none}
.metrics button{display:grid;text-align:left;padding:11px 13px;color:var(--ink);gap:2px}
.metrics strong{font-size:19px;overflow-wrap:anywhere}
.metrics small,.caption,.budget-card small{color:#496458;font-size:12px}
.budget-heading{margin-bottom:9px}.budget-heading h3{margin:0}.budget-stack{display:grid;gap:9px}
.budget-card{padding:12px 14px}.budget-card>.space:first-child{display:flex;flex-wrap:nowrap;gap:8px}
.budget-name{margin-right:auto;min-width:0;overflow-wrap:anywhere}.budget-card small{display:block}
.budget-value{text-align:right;min-width:0;overflow-wrap:anywhere}.budget-icon{background:#e7f1eb;border-radius:10px;padding:8px}
.budget-card .bar{margin:10px 0 5px}
.panel{margin-bottom:10px}.forecast{margin-top:14px}
summary{cursor:pointer;font-weight:730;min-height:26px}
details[open]>summary{margin-bottom:13px}
.forecast-row{padding:9px 0;border-top:1px solid #e1eae3;display:flex;justify-content:space-between;gap:8px}
.entries{display:grid;gap:8px}.entry{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px;margin-top:4px}
.entry>div{min-width:0;overflow-wrap:anywhere}.entry>div>span:first-child{display:block;font-size:11px;color:#496458}
.entry input{max-width:100px!important}
.plan-editor>.panel,details>.panel{padding:0;border:0}
#toast{bottom:calc(79px + env(safe-area-inset-bottom));z-index:5}
input,select{font-size:16px}
@media(max-width:479px){.heading,.wrap{padding-inline:13px}.formgrid{grid-template-columns:1fr}.hero{padding:17px}.installment,.edit-row{grid-template-columns:1fr}.installment-actions{justify-content:flex-start}.panel{padding:13px}}
.day-control{display:block;margin:12px 0;color:#36584a;font-size:13px}.day-control input{display:block;accent-color:#156754;min-height:32px;padding:0}
.salary-panel{margin-top:10px}.salary-panel>details,.salary-panel>.ghost{margin-top:8px}.salary-panel summary{font-size:13px;color:#36584a}
.budget-editor{display:grid;gap:10px}.budget-editor h3{margin:0 0 8px}
.quick-budget{width:100%;display:block;text-align:left;color:var(--ink);cursor:pointer}
.quick-budget:hover,.quick-budget:focus-visible{border-color:#36816a;background:#f8fffa}
.budget-plus{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:50%;background:#d8f0e2;color:#115e46;font-size:21px}
.budget-available{margin-top:8px;font-size:21px}.budget-available small{display:inline}
#expense-dialog{width:min(480px,calc(100% - 24px));padding:20px 20px max(20px,env(safe-area-inset-bottom));border:0;border-radius:22px;color:var(--ink);box-shadow:0 10px 45px #163a3250}
#expense-dialog::backdrop{background:#102f286b}#expense-dialog h3{margin:0}#expense-dialog form>label{margin-top:14px}
.quick-amount{position:relative}.quick-amount input{font-size:28px;padding-right:42px}.quick-amount>span{position:absolute;right:16px;top:12px;font-size:22px}
.expense-chips{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}.expense-chips label{margin:0;position:relative}.expense-chips input{position:absolute;opacity:0;width:1px;height:1px}.expense-chips span{display:inline-block;padding:7px 9px;border:1px solid #ccdcd3;border-radius:24px;cursor:pointer}.expense-chips input:checked+span{background:#d8f0e2;border-color:#2c8166}.expense-chips input:focus-visible+span{outline:2px solid #156754}.quick-submit{width:100%}
@media(max-width:520px){#expense-dialog{margin:auto auto 10px}}
.cycle-title{font-size:24px;text-transform:capitalize;color:#fff}
.cycle-switch{display:flex;justify-content:flex-end;margin:8px 0 12px}
.quick-entry{margin:0 0 12px;padding:13px 14px;background:#e4f2e9;border:1px solid #d4e8dc;border-radius:18px}
.quick-entry h3{margin:0;font-size:16px}.quick-entry small{color:#36584a}
.quick-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:8px;margin-top:10px}
.quick-tile{display:grid;place-items:center;gap:4px;min-height:66px;padding:6px;border:1px solid #cfe2d6;border-radius:13px;background:#fff;color:#173d30;overflow-wrap:anywhere}
.quick-tile span{font-size:22px;line-height:1.1}.quick-tile strong{font-size:12px}.quick-tile:hover{background:#f3fcf7;border-color:#338068}
[hidden]{display:none!important}
.cloud-panel{max-width:680px;margin:12px auto 0;padding:12px 16px;background:#fff;border:1px solid #dfeae1;border-radius:16px}
.cloud-panel p{margin:5px 0;color:#36584a}
.cloud-panel label{margin-top:10px}
.cloud-panel form .primary{margin-top:12px}
@media(max-width:720px){.cloud-panel{margin-inline:13px}}
/* Page Dettes */
.debt-overview{padding:18px;background:#174f3d;color:#fff;border-radius:16px;margin:12px 0}
.debt-overview strong{display:block;font-size:1.8rem}.debt-next{background:#eff6f1;border-radius:12px;padding:12px;margin-top:12px}
.debt-next .row{margin-top:8px}.debt-fold{margin-top:12px}.debt-fold summary{cursor:pointer;font-weight:650}
.debt-amounts{display:flex;flex-wrap:wrap;gap:8px 16px}.debt-amounts span{display:grid;gap:2px}
/* Dettes et paiements du cycle */
.debt-compact{padding:0;overflow:hidden;margin:0 0 8px}
.debt-compact>summary{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:14px;list-style:none}
.debt-compact>summary::-webkit-details-marker{display:none}
.debt-compact summary small,.cycle-check small{display:block;color:#526e62;font-weight:400}
.debt-compact summary b,.cycle-check strong{white-space:nowrap;font-variant-numeric:tabular-nums}
.debt-compact[open]>summary .debt-chevron{transform:rotate(90deg)}
.debt-body{border-top:1px solid #e1ebe4;padding:12px 14px}
.cycle-check{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #e1ebe4;cursor:pointer}
.cycle-check input{width:20px;height:20px;margin:0;accent-color:#21634a}
.cycle-check:has(input:checked) strong{color:#526e62;text-decoration:line-through}

/* Douceur rétro — palette, surfaces et contrôles */
:root {
  --bg:#f8f0dd; --surface:#fff9eb; --sub:#f2e4c7; --ink:#482b1c;
  --muted:#715741; --line:#dfcba7; --forest:#2f6a4a; --primary:#b84519;
  --accent:#793b26; --amber:#845714; --red:#963623;
  --ochre:#daa442; --blue:#4f8fbf; --peach:#ebb7a1;
}
body,header {background:var(--bg)}
body {font-family:ui-rounded,"Avenir Next Rounded","Trebuchet MS",system-ui,sans-serif}
.brand .mark {background:var(--peach);color:var(--ink);border-radius:50%}
h2,h3,.brand,.hero-amount,.cycle-title {font-weight:800;letter-spacing:-.035em}
.panel,.plan-card,.entry,.budget-card,.metrics button,.cloud-panel,.quick-entry,#expense-dialog {
  border-color:var(--line);border-radius:32px;background:var(--surface);color:var(--ink)
}
.cloud-panel,.quick-entry {background:var(--sub)}
.cloud-panel p,.day-control,.period-picker,.salary-panel summary,.quick-entry small,
.budget-card small,.caption,.entry>div>span:first-child,.debt-compact summary small,
.cycle-check small,.cycle-check:has(input:checked) strong,th,footer {color:var(--muted)}
.hero,.debt-overview {background:var(--primary);border-radius:44px;color:#fff9eb;padding:clamp(21px,5vw,32px);box-shadow:none}
.hero .space,.hero .cycle-title {color:#fff9eb}
.hero .bar {background:#8b3216}.hero .bar>div {background:#f2d395}
.bar {background:var(--sub)}.bar>div {background:var(--forest)}.bar>div.over {background:var(--red)}
.metrics button:nth-child(4n+1),.quick-tile:nth-child(4n+1) {background:var(--ochre);color:#382315;border-color:transparent}
.metrics button:nth-child(4n+2),.quick-tile:nth-child(4n+2) {background:var(--forest);color:#fff9eb;border-color:transparent}
.metrics button:nth-child(4n+3),.quick-tile:nth-child(4n+3) {background:var(--peach);color:#402417;border-color:transparent}
.metrics button:nth-child(4n),.quick-tile:nth-child(4n) {background:#c1dbe9;color:#193b50;border-color:transparent}
.metrics small,.quick-tile strong {color:inherit}
.metrics button {padding:15px 18px}.quick-tile {border-radius:24px}
button,button.small,.pill,.expense-chips span {border-radius:999px}
button,button.small {min-height:44px}
button {background:var(--sub);color:var(--accent)}
button.primary {background:var(--primary);color:#fff}
button.ghost {background:var(--surface);border-color:var(--accent);color:var(--accent)}
button.danger,.pill.red {background:#f4d9ca;color:#842f21}
.pill,.tip,.success {color:#214e36}.pill,.tip {background:#e2ebda}
.pill.blue {background:#d8e8f1;color:#234b62}.pill.amber,.notice {background:#f6e7bf;color:#69440f}
.summary,.inline-form,.budget-icon,.debt-next {background:var(--sub);border-color:var(--line);border-radius:20px}
.budget-plus {background:var(--peach);color:var(--accent)}
.quick-budget:hover,.quick-budget:focus-visible {background:#fbefd9;border-color:var(--accent)}
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),select,textarea {
  border-radius:20px;background:#fffcf4;border-color:#cbb38e;color:var(--ink);min-height:44px
}
.period-picker input {min-height:44px}
.day-control input,.cycle-check input,.category-choices input {accent-color:var(--forest)}
.cycle-check,.debt-body,.forecast-row,.installment,.edit-row,td,th {border-color:var(--line)}
.expense-chips span,.category-choices label {border-color:var(--line)}
.expense-chips input:checked+span,.category-choices label:has(:checked) {background:#c6dfed;border-color:#396e92}
:where(button,summary,input,select,textarea):focus-visible,.expense-chips input:focus-visible+span {
  outline:3px solid #32668a;outline-offset:2px
}
details>summary {min-height:44px;align-content:center}
#tabs {width:min(calc(100% - 16px),704px);bottom:calc(6px + env(safe-area-inset-bottom));background:var(--accent);
  border:0;border-radius:32px;padding:6px;box-shadow:0 3px 12px #482b1c24}
#tabs button {background:transparent;color:#fff2da;border-radius:24px}
#tabs button.active {background:var(--bg);color:var(--accent)}
#toast {background:var(--accent);color:#fff9eb;border-radius:20px}

<script>

const currency=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});

const cents=value=>Math.round((Number(value)||0)*100);
const money=c=>Math.round(c)/100;
const validNumber=v=>v!==null&&String(v).trim()!==''&&Number.isFinite(Number(String(v).replace(',','.')));
const amountFrom=v=>Number(String(v).replace(',','.'));
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function currentMonth(){return today().slice(0,7)}
function monthShift(month,delta){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return '';const [year,m]=month.split('-').map(Number),index=year*12+m-1+delta;return `${String(Math.floor(index/12)).padStart(4,'0')}-${String(index%12+1).padStart(2,'0')}`}
function monthLabel(m){if(!m)return '—';const [y,mo]=m.split('-').map(Number);return new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(new Date(y,mo-1,15))}
function normDate(value){const s=String(value??'').trim();let d=s;if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const [day,month,year]=s.split('/');d=`${year}-${month}-${day}`}if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;const [y,m,day]=d.split('-').map(Number);const date=new Date(y,m-1,day);return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===day?d:null}
function normalizeSim(raw){
  const a=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};

function normalizeData(raw){const d=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};const safeArray=k=>Array.isArray(d[k])?d[k]:[];return {schemaVersion:3,salaryReceipts:normalizeReceipts(d.salaryReceipts),payday:Number.isInteger(d.payday)&&d.payday>=1&&d.payday<=31?d.payday:1,incomes:normalizeIncome(d.incomes),starting:Number.isFinite(Number(d.starting))?Number(d.starting):0,transactions:safeArray('transactions').filter(x=>x&&normDate(x.date)&&Number.isFinite(Number(x.amount))).map(x=>({...x,id:String(x.id||uid()),date:normDate(x.date),label:String(x.label||'Opération'),type:x.type==='revenu'?'revenu':'depense',category:String(x.category||'Autres'),amount:Math.abs(Number(x.amount))})),categories:safeArray('categories').filter(x=>x&&x.name).map(normalizeCategory),subscriptions:safeArray('subscriptions').filter(x=>x&&x.name&&/^\d{4}-\d{2}$/.test(x.start||'')).map(x=>({...x,id:String(x.id||uid()),name:String(x.name),amount:Math.max(0,Number(x.amount)||0),end:String(x.end||'')})),plans:safeArray('plans').filter(p=>p&&p.name&&Array.isArray(p.payments)).map(p=>{const legacyShift=p.payments.length>0&&!('category' in p)&&p.payments.every(pm=>!pm.id);return {...p,id:String(p.id||uid()),kind:p.kind==='provision'?'provision':'paiement',name:String(p.name),category:String(p.category||'Autres'),amount:Math.max(0,Number(p.amount)||0),payments:p.payments.filter(x=>x&&/^\d{4}-(0[1-9]|1[0-2])$/.test(x.month||'')).map(x=>({...x,id:String(x.id||uid()),month:legacyShift?monthShift(x.month,1):x.month,amount:Math.max(0,Number(x.amount)||0),reserved:!!x.reserved}))}}),goals:safeArray('goals').filter(g=>g&&g.name).map(g=>({...g,id:String(g.id||uid()),name:String(g.name),target:Math.max(0,Number(g.target)||0),saved:Math.max(0,Number(g.saved)||0)})),simulator:normalizeSim(d.simulator)};}

let tab='Tableau de bord',selectedMonth=visibleCycle(cycleMonth(today())),txFilter='all',editTxId=null,editPlanId=null,draft=null,payForm=null,toastTimer;

const txMonth=m=>db.transactions.filter(t=>t.date.slice(0,7)===m);

function balance(){return money(cents(db.starting)+db.transactions.filter(t=>t.date<=today()).reduce((s,t)=>s+(t.type==='revenu'?1:-1)*cents(t.amount),0))}
function subscriptionDue(m){return money(db.subscriptions.filter(s=>s.start<=m&&(!s.end||s.end>=m)).reduce((s,x)=>s+cents(x.amount),0))}
function linkedTransactions(planId,paymentId){return db.transactions.filter(t=>t.planId===planId&&t.installmentId===paymentId&&t.type==='depense')}

const navItems = [['Tableau de bord','⌂','Accueil'],['Budgets','◔','Budgets'],['Revenus','↙','Revenus'],['Charges fixes','↗','Charges'],['Dettes','≡','Dettes']];
let overviewIndex = 0;

function bindOverview() {
  const track = document.getElementById('overview-track');
  const slides = Array.from(track.children);
  const buttons = Array.from(document.querySelectorAll('.overview-switch button'));
  function sync() {
    const step = slides[1].offsetLeft - slides[0].offsetLeft;
    if (!step) return;
    overviewIndex = track.scrollLeft >= step / 2 ? 1 : 0;
    track.style.height = track.querySelector('details[open]')
      ? Math.ceil(slides[overviewIndex].getBoundingClientRect().height) + 'px' : '';

  }
  function move(i,behavior) {
    track.scrollTo({left:slides[i].offsetLeft-slides[0].offsetLeft,behavior});

    window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'));

  track.addEventListener('toggle',sync,true);

  slides.forEach(slide=>overviewObserver.observe(slide));

function saveTx(form){const f=new FormData(form),label=String(f.get('label')||'').trim(),date=normDate(f.get('date')),amount=amountFrom(f.get('amount')),type=f.get('type')==='Revenu'?'revenu':'depense';if(!label||!date||!Number.isFinite(amount)||cents(amount)<=0)return alert('Vérifiez la date, le libellé et le montant positif.');let t=db.transactions.find(x=>x.id===editTxId);if(t){Object.assign(t,{date,label,amount:money(cents(amount)),type,category:String(f.get('category'))});if(t.planId&&type!=='depense'){delete t.planId;delete t.installmentId}}else db.transactions.push({id:uid(),date,label,amount:money(cents(amount)),type,category:String(f.get('category'))});editTxId=null;save('Transaction enregistrée')}
function normalizeCategory(raw) {
  return {...normalizeBudgetAmount(raw), scoped:raw.scoped===true,
    changes:(Array.isArray(raw.changes)?raw.changes:[]).filter(change=>change && /^\d{4}-(0[1-9]|1[0-2])$/.test(change.month))
      .map(change=>({...normalizeBudgetAmount({...change,name:raw.name}),month:change.month,once:change.once===true}))};
}
function categoryForMonth(category, month) {
  const changes = category.changes || [];
  const once = changes.find(change=>change.once && change.month===month);
  const ongoing = changes.filter(change=>!change.once && change.month<=month).sort((a,b)=>b.month.localeCompare(a.month))[0];
  return once || ongoing || (category.scoped ? null : category);
}
function cycleCategories(month=selectedMonth) {
  return db.categories.map((category,index)=>({budget:categoryForMonth(category,budgetMonth(month)),index})).filter(item=>item.budget);
}
function setBudgetAmount(category, form, limit) {
  const month = budgetMonth(selectedMonth), once = form.get('scope')==='once';
  const change = {month,once,limit:money(cents(limit)),cadence:form.get('cadence'),perCycle:true};
  category.changes = (category.changes || []).filter(item=>item.month!==month || (!item.once && once));
  category.changes.push(change);
}
function budgetScope() {
  return '<label>Appliquer à<select name="scope"><option value="once">Ce cycle uniquement</option><option value="ongoing">Ce cycle et les suivants</option></select></label>';
}
function normalizeBudgetAmount(raw) {
  const name = String(raw.name);
  const limit = Math.max(0,Number(raw.limit)||0);
  if (raw.cadence==='weekly' || raw.cadence==='daily') return {name,limit,cadence:raw.cadence,perCycle:raw.perCycle===true};
  if (/course|nourriture|aliment/i.test(name)) return {name,limit:money(cents(limit)*7/30),cadence:'weekly'};
  return {name,limit,cadence:'daily'};
}

function renderDraft(){const categoryChoices=[...new Set([...db.categories.map(c=>c.name),draft.category])];return `<section class="panel"><div class="space"><h3>${editPlanId?'Modifier l’échéancier':'Créer un échéancier'}</h3>${editPlanId?'<button class="ghost small" data-action="new-plan">+ Nouvel échéancier</button>':''}</div><form data-form="plan" id="plan-form"><div class="formgrid"><div><label>Nom de l'achat ou du projet</label><input data-draft="name" value="${esc(draft.name)}" placeholder="Ex. Ordinateur" maxlength="120" required></div><div><label>Nature</label><select data-draft="kind"><option value="paiement" ${draft.kind==='paiement'?'selected':''}>Paiement en plusieurs fois</option><option value="provision" ${draft.kind==='provision'?'selected':''}>Provision / épargne anticipée</option></select></div><div><label>Montant total (€)</label><input data-draft="amount" type="number" min="0.01" max="100000000" step="0.01" value="${draft.amount}" required></div><div><label>Nombre de mois (1 à 60)</label><input data-draft="count" type="number" min="1" max="60" step="1" value="${draft.count}" required></div><div><label>Premier mois</label><input data-draft="start" type="month" value="${esc(draft.start)}" required></div><div><label>Catégorie des débits</label><select data-draft="category">${uiSelect(categoryChoices,draft.category)}</select></div></div>

ectif supprimé')}return;}}

function normalizeIncome(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter(item => item?.name && monthShift(item.start, 0)).map(item => ({
    id: String(item.id || uid()),
    name: String(item.name),
    kind: ['Salaire', 'Aide', 'Autre'].includes(item.kind) ? item.kind : 'Autre',
    start: item.start,
    amount: Math.max(0, cents(item.amount)) / 100,
    exceptions: Object.fromEntries(Object.entries(item.exceptions || {})
      .filter(([month, amount]) => monthShift(month, 0) && Number.isFinite(amount) && amount >= 0))
  }));
}

function monthlyIncome(month) {
  return db.incomes.filter(item => item.start <= month)
    .reduce((sum, item) => sum + cents(item.exceptions[month] ?? item.amount), 0);
}

function dayNumber(date) { return Date.parse(date + 'T00:00:00Z') / 86400000; }
function dateAtDay(day) { return new Date(day * 86400000).toISOString().slice(0,10); }
function budgetMonthOffset() {
  const firstReceipt = db.salaryReceipts[0];
  const payday = db.payday===1 && firstReceipt ? Number(firstReceipt.date.slice(8)) : db.payday;
  return payday>=15 ? 1 : 0;
}
function budgetMonth(cycleKey) {
  return monthShift(cycleKey,budgetMonthOffset());
}
function cycleKeyForBudgetMonth(month) {
  return monthShift(month,-budgetMonthOffset());
}
function normalizeReceipts(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter(receipt => receipt && monthShift(receipt.month,0) && normDate(receipt.date))
    .map(receipt => ({month:receipt.month,date:normDate(receipt.date)}))
    .sort((a,b)=>a.month.localeCompare(b.month));
}
function dateInMonth(month, day) {
  const [year, number] = month.split('-').map(Number);
  const last = new Date(year, number, 0).getDate();
  return month + '-' + String(Math.min(day,last)).padStart(2,'0');
}
function monthIndex(month) {
  const [year, number] = month.split('-').map(Number);
  return year * 12 + number;
}
function paydayIn(month) {
  const anchor = db.salaryReceipts.findLast(receipt => receipt.month <= month);
  if (!anchor) return dateInMonth(month,db.payday);
  const distance = monthIndex(month) - monthIndex(anchor.month);
  return dateInMonth(monthShift(anchor.date.slice(0,7),distance),Number(anchor.date.slice(8)));
}
function cycleBoundary(month, reference=today()) {
  const latest = db.salaryReceipts.at(-1);
  if (!latest || month <= latest.month) return paydayIn(month);
  const nextMonth = monthShift(latest.month,1);
  const expected = paydayIn(nextMonth);
  if (expected > reference) return paydayIn(month);
  const tomorrow = dateAtDay(dayNumber(reference)+1);
  const distance = monthIndex(month)-monthIndex(nextMonth);
  return dateInMonth(monthShift(tomorrow.slice(0,7),distance),Number(tomorrow.slice(8)));
}
function cycleMonth(date) {
  const reference = today();
  let month = date.slice(0,7);
  while (date < cycleBoundary(month,reference)) month = monthShift(month,-1);
  while (date >= cycleBoundary(monthShift(month,1),reference)) month = monthShift(month,1);
  return month;
}
function cycle(month) {
  const reference = today(), nextMonth = monthShift(month,1);
  const start = cycleBoundary(month,reference), next = cycleBoundary(nextMonth,reference);
  const latest = db.salaryReceipts.at(-1);
  const expected = latest?.month === month ? paydayIn(nextMonth) : next;
  const waiting = latest?.month === month && expected <= reference;
  const days = dayNumber(next)-dayNumber(start);
  const allocationDays = waiting ? dayNumber(expected)-dayNumber(start) : days;
  return {start,next,end:dateAtDay(dayNumber(next)-1),days,allocationDays,waiting,expected};
}
function recordSalary(rawDate, correction=false) {
  const date = normDate(rawDate);
  const latest = db.salaryReceipts.at(-1);
  const previous = db.salaryReceipts.at(-2);
  if (!date || date > today()) return alert('Choisis une date de réception passée ou aujourd’hui.');
  if (latest?.date === date) return;
  const month = latest ? (correction ? latest.month : monthShift(latest.month,1)) : date.slice(0,7);
  const lowerBound = correction ? previous?.date || paydayIn(monthShift(month,-1)) : latest?.date;
  if (lowerBound && date <= lowerBound) return alert('La date doit être après le début du cycle précédent.');
  if (correction && latest) latest.date = date;
  else db.salaryReceipts.push({month,date});
  selectedMonth = visibleCycle(month);
  tab = 'Tableau de bord';
  return save('Salaire enregistré');
}
function shortDate(date) {
  return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'}).format(new Date(date+'T12:00:00'));
}
function variableExpenses(period) {
  return db.transactions.filter(t => t.type==='depense' && !t.planId && t.date>=period.start && t.date<period.next);
}
function position(category, expenses, period, date) {
  const elapsed = Math.max(0,Math.min(period.allocationDays,dayNumber(date)-dayNumber(period.start)+1));
  const limit = cents(category.limit), weekly = category.cadence==='weekly';
  const days = period.allocationDays;
  const cap = weekly && !category.perCycle ? Math.round(limit * days / 7) : limit;
  const weekday = (new Date(period.start+'T12:00:00Z').getUTCDay()+6)%7;
  const weeklyDays = category.perCycle ? Math.ceil((elapsed+weekday)/7)*7-weekday : Math.ceil(elapsed/7)*7;
  const released = elapsed===0 ? 0 : weekly ? Math.round(cap*Math.min(days,weeklyDays)/days) : Math.round(cap*elapsed/days);
  const used = expenses.filter(t => t.category===category.name && t.date<=date).reduce((n,t)=>n+cents(t.amount),0);
  return {cap,released,used,available:released-used,rate:weekly?money(cap*7/days):money(cap/days),weekly};
}
function monthBudget(month, period, expenses) {
  const financialMonth = budgetMonth(month);
  const income = monthlyIncome(financialMonth), fixed = cents(subscriptionDue(financialMonth));
  const scheduled = db.plans.filter(p=>p.kind==='paiement').flatMap(p=>p.payments)
    .filter(p=>p.month===financialMonth).reduce((sum,p)=>sum+cents(p.amount),0);
  const arrears = month===cycleMonth(today()) ? cents(overdueTotal()) : 0;
  const active = cycleCategories(month);
  const variable = active.reduce((sum,{budget:c})=>{
    const budget = position(c,expenses,period,period.end);
    return sum + Math.max(budget.cap,budget.used);
  },0)
    + expenses.filter(t=>!active.some(({budget:c})=>c.name===t.category)).reduce((sum,t)=>sum+cents(t.amount),0);
  return {income,fixed,debt:scheduled+arrears,variable,free:income-fixed-scheduled-arrears-variable};
}
function amountCell(value) {
  return `<strong class="${value<0?'negative':''}">${euro(money(value))}</strong>`;
}
function budgetCards(period, expenses, date, quick=false) {
  const canAdd = quick && date>=period.start && date<period.next && date<=today();
  return cycleCategories().map(({budget:c,index}) => {
    const b = position(c,expenses,period,date);
    const content = `<div class="space"><span class="budget-icon" aria-hidden="true">${categoryIcon(c.name)}</span><div class="budget-name"><strong>${esc(c.name)}</strong><small>${euro(b.rate)} / ${b.weekly?'semaine':'jour'}</small></div>${canAdd?'<span class="budget-plus" aria-hidden="true">+</span>':''}</div>
    <div class="budget-available">${amountCell(b.available)} <small>${b.available<0?'de dépassement':'disponibles'}</small></div>
    ${progress(b.used,b.cap)}<div class="space caption"><span>${euro(money(b.used))} dépensés</span><span>${euro(money(b.released))} cumulés</span></div>`;
    return canAdd ? `<button type="button" class="budget-card quick-budget" data-action="quick-expense" data-index="${index}" data-date="${date}" aria-label="Ajouter une dépense · ${esc(c.name)} · ${euro(money(b.available))} disponibles">${content}</button>`
      : `<article class="budget-card">${content}</article>`;
  }).join('') || '<p class="muted">Ajoute un budget pour commencer le suivi.</p>';
}
function expenseChoices(name) {
  const icon = categoryIcon(name);
  if (icon==='🛒') return [['🥬','Supermarché'],['🥖','Boulangerie'],['🥡','À emporter']];
  if (icon==='🎟️') return [['🍺','Bar'],['🎬','Cinéma'],['🍕','Restaurant']];
  if (icon==='🚆') return [['🚇','Métro'],['🚕','Taxi'],['⛽','Carburant']];
  return [['☕','Café'],['🛍️','Achats'],['🎁','Cadeau']];
}
function openQuickExpense(index,date) {

  dialog.innerHTML = `<form data-form="quick-expense" data-index="${index}" data-date="${date}">
    <div class="space"><h3 id="quick-expense-title">${categoryIcon(category.name)} ${esc(category.name)}</h3><button type="button" class="ghost" data-action="close-expense" aria-label="Fermer">×</button></div>
    <label for="quick-amount">${date===today()?'Dépensé aujourd’hui':'Dépensé le '+shortDate(date)}</label>
    <div class="quick-amount"><input id="quick-amount" name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="0,00" required><span aria-hidden="true">€</span></div>
    <fieldset class="expense-chips"><legend>Libellé facultatif</legend>
      <label><input type="radio" name="label" value="" checked><span>Sans détail</span></label>
      ${expenseChoices(category.name).map(([icon,label])=>`<label><input type="radio" name="label" value="${label}"><span>${icon} ${label}</span></label>`).join('')}
    </fieldset><button class="primary quick-submit">Ajouter la dépense</button></form>`;
  dialog.showModal();
  dialog.querySelector('#quick-amount').focus();
}
function saveQuickExpense(form, fields) {
  const category = db.categories[Number(form.dataset.index)], date = normDate(form.dataset.date);
  const amount = amountFrom(fields.get('amount'));
  if (!category || !date || date>today() || !Number.isFinite(amount) || cents(amount)<=0) return alert('Vérifie le montant et la date.');
  const chosen = fields.get('label');
  const label = expenseChoices(category.name).some(([,value])=>value===chosen) ? chosen : category.name;
  db.transactions.push({id:uid(),date,label,type:'depense',category:category.name,amount:money(cents(amount))});
  form.closest('dialog').close();
  selectedMonth=cycleMonth(date);
  simulatedBudgetDate=null;
  return save('Dépense enregistrée');
}
function cyclePaymentRows() {
  const month = budgetMonth(selectedMonth);
  const charges = db.subscriptions.filter(c=>c.start<=month && (!c.end || c.end>=month));
  const rows = charges.filter(c=>cents(c.amount)>0).map(charge=>({
    charge, name:charge.name, amount:charge.amount,
    left:Array.isArray(charge.checkedMonths)&&charge.checkedMonths.includes(month)?0:charge.amount
  }));
  for (const plan of db.plans.filter(p=>p.kind==='paiement')) {
    for (const payment of plan.payments.filter(pm=>pm.month===month && cents(pm.amount)>0)) {
      rows.push({plan,payment,name:plan.name,amount:payment.amount,left:remaining(plan,payment),
        checkedDebit:linkedTransactions(plan.id,payment.id).find(t=>t.cycleChecklist===true)});
    }
  }
  return rows;
}

function updateCyclePayment(index, checked) {
  if (!validLink || revision===null || pending || busy) return;
  const row = cyclePaymentRows()[index];
  if (!row) return;
  if (row.charge) {
    const month = budgetMonth(selectedMonth);
    const months = Array.isArray(row.charge.checkedMonths)?row.charge.checkedMonths:[];
    row.charge.checkedMonths = [...months.filter(value=>value!==month), ...(checked?[month]:[])];
  } else if (checked && row.left) {
    if (row.checkedDebit) row.checkedDebit.amount = money(cents(row.checkedDebit.amount)+cents(row.left));
    else db.transactions.push({
      id:uid(),date:today(),label:row.name,type:'depense',category:row.plan.category || 'Autres',
      amount:row.left,planId:row.plan.id,installmentId:row.payment.id,cycleChecklist:true
    });
  } else if (!checked && row.checkedDebit) {
    db.transactions = db.transactions.filter(t=>t.id!==row.checkedDebit.id);
  } else return;
  save(checked?'Paiement coché':'Paiement décoché');
}

function budgetBreakdown(period, entries) {
  const viewDate = budgetViewDate();
  const items = cycleCategories().map(({budget,index})=>({
    budget,index,data:position(budget,entries,period,viewDate),
    color:['#d9a344','#2e654a','#e9b49b','#8cb5ce','#ad7358'][index%5]
  }));
  const total = items.reduce((sum,item)=>sum+item.data.cap,0);
  let offset = 0;
  const spendingSlices = [];
  const slices = items.filter(item=>item.data.cap>0).map(({data,color,index})=>{
    const length = 100*data.cap/total;
    const point = percent=>{
      const angle = percent*Math.PI/50-Math.PI/2;
      return [64+51*Math.cos(angle),64+51*Math.sin(angle)].join(' ');
    };
    const geometry = (start, size)=>size>=100
      ? 'M 64 13 A 51 51 0 1 1 64 115 A 51 51 0 1 1 64 13'
      : `M ${point(start)} A 51 51 0 ${size>50?1:0} 1 ${point(start+size)}`;
    const arc = `<path d="${geometry(offset,length)}" fill="none" stroke="${color}" stroke-width="22" data-action="open-budget" data-index="${index}"/>`;
    const used = length*Math.max(0,Math.min(1,data.used/data.cap));
    const marker = Math.max(offset+.02,Math.min(offset+length-.02,offset+length*data.released/data.cap));
    spendingSlices.push(`<path d="${geometry(offset,length)}" fill="none" stroke="${color}" stroke-opacity=".40" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <path d="${geometry(offset,length)}" fill="none" stroke="${color}" stroke-opacity=".22" stroke-width="22"/>
      ${used>0?`<path d="${geometry(offset,used)}" fill="none" stroke="${color}" stroke-width="22"/>`:''}
      <line x1="64" y1="3" x2="64" y2="23" stroke="#193b50" stroke-width="2" transform="rotate(${marker*3.6} 64 64)"/>`);
    offset += length;
    return arc;
  });
  const spent = entries.filter(entry=>entry.date<=viewDate).reduce((sum,entry)=>sum+cents(entry.amount),0);
  const unbudgeted = spent-items.reduce((sum,item)=>sum+item.data.used,0);
  return `<section class="panel budget-overview cycle-overview"><div class="space">${monthPicker(true)}<button type="button" class="budget-add ghost" data-action="open-budget" aria-haspopup="dialog" aria-label="Nouveau budget">+</button></div>
  <div class="budget-chart"><div class="budget-ring"><svg viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="51" fill="none" stroke="#a7c6d8" stroke-width="22"/>${slices.join('')}</svg>
  <div class="budget-ring-total"><strong>${euro(money(total))}</strong><small>Total prévu</small></div></div>
  <div class="budget-chart-keys">${items.map(({budget,data,color,index})=>`<button type="button" data-action="open-budget" data-index="${index}" aria-haspopup="dialog"><span class="budget-swatch" style="background:${color}" aria-hidden="true"></span><span>${esc(budget.name)}<small>${euro(money(data.cap))}</small></span></button>`).join('')}</div></div>
  ${[...items,null].map(item=>`<dialog class="jar-dialog" id="budget-dialog-${item?.index??'new'}" aria-label="${item?esc(item.budget.name):'Nouveau budget'}"><button type="button" class="ghost small" data-action="close-budget-dialog">Fermer</button>${budgetForm(item)}</dialog>`).join('')}</section>
  <section class="panel budget-overview"><div class="space"><div><h3>Dépenses</h3>${simulatedBudgetDate?`<small>Date simulée · ${shortDate(viewDate)}</small>`:''}</div><button type="button" class="budget-add ghost" data-action="open-budget-expense" aria-haspopup="dialog" aria-label="Ajouter une dépense">+</button></div>
  <div class="budget-chart"><div class="budget-ring"><svg viewBox="0 0 128 128" aria-hidden="true">${spendingSlices.length?spendingSlices.join(''):'<circle cx="64" cy="64" r="51" fill="none" stroke="#a7c6d8" stroke-width="2"/>'}</svg>
  <div class="budget-ring-total"><strong>${euro(money(spent))}</strong><small>Total dépensé</small></div></div>
  <div class="budget-chart-keys spending-keys">${items.map(({budget,data,color})=>`<div><span class="budget-swatch" style="background:${color}" aria-hidden="true"></span><span><strong>${esc(budget.name)}</strong><small>${euro(money(data.used))} dépensés</small><small>${euro(money(Math.abs(data.cap-data.used)))} ${data.used>data.cap?'dépassés':'restants'}</small></span></div>`).join('')}
  ${unbudgeted>0?`<div><span>Hors budget<small>${euro(money(unbudgeted))} dépensés</small></span></div>`:''}</div></div>
  ${total>0?'<small class="spending-marker">│ Budget débloqué à ce jour</small>':''}</section>`;
}

function saveMonthlyForm(form) {
  const f = new FormData(form);
  const raw = f.get('amount');
  const amount = amountFrom(raw);
  if (!Number.isFinite(amount) || amount < 0) return alert('Vérifiez le montant.');
  if (form.dataset.form === 'recurring-income') {
    const name = String(f.get('name') || '').trim(), start = f.get('start'), kind = f.get('kind');
    if (!name || !monthShift(start,0)) return alert('Vérifiez le libellé et le mois de début.');
    const item = db.incomes.find(i => i.id === incomeEdit);
    if (item) Object.assign(item, {name, start, kind, amount:money(cents(amount))});
    else db.incomes.push({id:uid(),name,start,kind,amount:money(cents(amount)),exceptions:{}});
    incomeEdit = null;
    return save('Revenu enregistré');
  }
  if (form.dataset.form === 'income-exception') {
    const item = db.incomes.find(i => i.id === form.dataset.id);
    const month = budgetMonth(selectedMonth);
    if (!item || month < item.start) return;
    if (raw === '') delete item.exceptions[month];
    else item.exceptions[month] = money(cents(amount));
    return save('Revenu du mois mis à jour');
  }
  const category = f.get('category') === null ? null : db.categories[Number(f.get('category'))];
  const date = normDate(f.get('date')), label = String(f.get('label') || '').trim();
  if (!category || !date || cycleMonth(date) !== selectedMonth || cents(amount) <= 0)
    return alert('Vérifiez la catégorie, la date et le montant.');
  db.transactions.push({id:uid(),date,label:label||category.name,type:'depense',category:category.name,amount:money(cents(amount))});
  expenseOpen = false;
  if(date>budgetViewDate())simulatedBudgetDate=date;
  return save('Dépense enregistrée');
}

const linkKey = new URLSearchParams(location.hash.slice(1)).get('acces');
const validLink = /^[a-f0-9]{64}$/.test(linkKey || '');
async function budgetRequest(method, body={}) {
  const response = await fetch(CLOUD_URL + '/rest/v1/rpc/' + method, {
    method:'POST', credentials:'omit', referrerPolicy:'no-referrer', cache:'no-store',
    headers:{apikey:CLOUD_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_cle:linkKey,...body}),
  });
  if (!response.ok) throw new Error('Accès indisponible');
  return response.json();
}

let revision = null;
let pending = null;
let busy = false;
let conflict = false;
let generation = 0;

function syncMessage(message) {
  cloudStatus.textContent = message;
}
function updateCloudControls() {
  app.inert = busy || !!pending;
  retry.hidden = busy || !pending || conflict;
  reload.hidden = busy || !pending;
}
function installSharedBudget(data, version) {
  const firstLoad = revision === null;
  const previousCycle = cycleMonth(today());
  db = normalizeData(data);
  revision = version;
  if (firstLoad || selectedMonth === previousCycle) selectedMonth = visibleCycle(cycleMonth(today()));
  editTxId = incomeEdit = chargeEdit = editPlanId = null;
  payForm = null;
  makeDraft();
  render();
}

async function refreshSharedBudget(epoch=generation) {
  if (!validLink || busy || pending) return;
  let data;
  try {
    data = await budgetRequest('mon_budget_lire_lien');
  } catch {
    if (epoch === generation && !pending && !busy) syncMessage('Connexion indisponible. Nouvelle tentative automatique.');
    return;
  }
  if (epoch !== generation || pending || busy) return;
  if (!data) {
    app.querySelector('dialog[open]')?.close();
    app.hidden = true;
    document.getElementById('view').replaceChildren();
    db = normalizeData(clone(DEFAULT_DATA));
    revision = null;
    syncMessage('Ce lien d’accès est invalide ou a été désactivé.');
    return;
  }
  if (revision === null || data.revision > revision) {
    if (revision !== null && (app.querySelector('dialog[open]') || document.activeElement?.closest('#cloud-app form'))) return;
    installSharedBudget(data.payload,data.revision);
  }
  app.hidden = false;
  syncMessage('Synchronisé');
}

function save(message='Enregistré') {
  if (!validLink || revision === null || pending || busy) return false;
  pending = {payload:clone(db), version:revision, message};
  pushSharedBudget();
  return true;
}
async function pushSharedBudget() {
  if (!pending || busy || conflict) return;
  busy = true;
  updateCloudControls();
  syncMessage('Enregistrement du budget partagé…');
  const epoch = generation;
  try {
    const data = await budgetRequest('mon_budget_ecrire_lien', {
      p_revision:pending.version,
      p_payload:pending.payload,
    });
    if (epoch !== generation) return;
    if (data === null) {
      conflict = true;
      syncMessage('Une modification a déjà été publiée. Recharge la dernière version, puis ressaisis ta modification.');
      return;
    }
    const message = pending.message;
    revision = data;
    pending = null;
    render();
    syncMessage('Synchronisé');
    if (message) toast(message);
  } catch {
    if (epoch === generation) syncMessage('Enregistrement à confirmer. Réessaie ou recharge le budget partagé.');
  } finally {
    if (epoch === generation) {
      busy = false;
      updateCloudControls();
    }
  }
}

retry.addEventListener('click',pushSharedBudget);
reload.addEventListener('click',()=>{
  if (!confirm('Recharger la version en ligne et abandonner la modification locale ?')) return;
  generation++;
  pending = null;
  conflict = false;
  app.hidden = true;
  revision = null;
  updateCloudControls();
  void refreshSharedBudget();
});
window.addEventListener('beforeunload',event=>{
  if (pending) {
    event.preventDefault();
    event.returnValue = '';
  }
});
if (validLink) {
  syncMessage('Chargement du budget partagé…');
  void refreshSharedBudget();
  setInterval(()=>{if (!document.hidden) void refreshSharedBudget();},5000);
  document.addEventListener('visibilitychange',()=>{if (!document.hidden) void refreshSharedBudget();});
} else {
  syncMessage('Ouvre le lien privé qui t’a été communiqué pour accéder au budget.');
}

// La synchronisation du budget et la mise à jour du fichier HTML sont indépendantes.
const updateButton = document.getElementById('app-update');
let nextAppUrl = null;
let checkingApp = false;
let lastAppCheck = 0;
let editedForm = null;
app.addEventListener('input', event => {
  if (event.target.form) editedForm = event.target.form;
});
function openAppUpdate(explicit) {
  if (!nextAppUrl || busy || pending || conflict || document.hidden) return;
  const editing = editedForm?.isConnected || app.querySelector('dialog[open]') ||
    document.activeElement?.closest('#cloud-app form');
  if (editing && (!explicit || !confirm('Quitter la saisie en cours pour ouvrir la mise à jour ?'))) return;
  if (!explicit && tab !== 'Tableau de bord') return;
  const target = new URL(nextAppUrl);
  target.hash = location.hash;
  location.replace(target.href);
}
async function checkAppUpdate() {
  if (nextAppUrl) return openAppUpdate(false);
  if (checkingApp || document.hidden || Date.now()-lastAppCheck<15000) return;
  checkingApp = true;
  lastAppCheck = Date.now();
  try {
    const address = new URL(location.href);
    address.hash = '';
    address.searchParams.set('version', String(lastAppCheck));
    const response = await fetch(address.href,{cache:'no-store',referrerPolicy:'no-referrer'});
    if (!response.ok) return;
    const html = await response.text();
    const code = html.match(/<script>([\s\S]*?)<\/script>/i);
    const style = html.match(/<style>([\s\S]*?)<\/style>/i);
    if (!code || !style || !html.includes('id="cloud-app"')) return;
    const normalize = value => value.replace(/\r\n?/g,'\n');
    if (normalize(code[1])===normalize(document.querySelector('script').textContent) &&
        normalize(style[1])===normalize(document.querySelector('style').textContent)) return;
    nextAppUrl = address.href;
    updateButton.hidden = false;
    openAppUpdate(false);
  } catch { /* Réessayer à la prochaine ouverture en ligne. */ }
  finally { checkingApp = false; }
}
updateButton.addEventListener('click',()=>openAppUpdate(true));
window.addEventListener('pageshow',checkAppUpdate);
document.addEventListener('visibilitychange',()=>{if (!document.hidden) void checkAppUpdate();});

const launchScreen = document.getElementById('launch-screen');
const launchVideo = launchScreen.querySelector('video');
const toneCanvas = document.createElement('canvas');
toneCanvas.width = toneCanvas.height = 8;
const toneContext = toneCanvas.getContext('2d',{willReadFrequently:true});
function matchClipTone() {
  if (!toneContext || launchVideo.readyState < 2 || !launchScreen.classList.contains('watching')) return;
  try {
    toneContext.drawImage(launchVideo,0,0,8,8);
    const pixels = toneContext.getImageData(0,0,8,8).data;
    const rgb = [0,0,0];
    let count=0;
    for (let i=0;i<64;i++) {
      if (i>=8 && i<56 && i%8!==0 && i%8!==7) continue;
      for (let c=0;c<3;c++) rgb[c]+=pixels[i*4+c];
      count++;
    }
    launchScreen.style.setProperty('--clip-tone','rgb('+rgb.map(v=>Math.round(v/count)).join(',')+')');
  } catch { launchVideo.removeEventListener('timeupdate',matchClipTone); }
}
launchVideo.addEventListener('timeupdate',matchClipTone);
const soundButton = document.getElementById('launch-sound');
soundButton.addEventListener('click',()=>{
  launchVideo.muted = false;
  launchVideo.play().then(()=>{soundButton.hidden=true;}).catch(()=>{launchVideo.muted=true;});
});
let launchTimers = [], launchGeneration = 0;
function resetLaunch() {
  launchGeneration++;
  launchTimers.forEach(clearTimeout);
  launchTimers = [];
  soundButton.hidden = true;
  launchVideo.pause();
  launchVideo.hidden = true;
  launchScreen.hidden = true;
  launchScreen.classList.remove('leaving','watching');
  document.getElementById('launch-skip').hidden=true;
  launchVideo.onended=null;
}
function playLaunch() {
  if (document.hidden || !launchScreen.hidden) return;
  const generation = ++launchGeneration;
  launchScreen.hidden = false;
  const finish = () => {
    if (generation !== launchGeneration || launchScreen.classList.contains('leaving')) return;
    launchScreen.classList.add('leaving');
    launchTimers.push(setTimeout(resetLaunch,350));
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    launchTimers.push(setTimeout(finish,600));
    return;
  }
  launchVideo.onended=finish;
  document.getElementById('launch-skip').onclick=finish;
  launchTimers.push(setTimeout(async ()=>{
    if (generation !== launchGeneration) return;
    launchVideo.currentTime = 0;
    launchVideo.hidden = false;
    launchVideo.muted = false;
    try {
      await launchVideo.play();
    } catch {
      if (generation !== launchGeneration) return;
      launchVideo.muted = true;
      soundButton.hidden = false;
      try { await launchVideo.play(); } catch { launchVideo.hidden = true; }
    }
    if (generation === launchGeneration && !launchVideo.paused) {
      clearTimeout(watchdog);
      launchScreen.classList.add('watching');
      matchClipTone();
      document.getElementById('launch-skip').hidden=false;
    }
  },1650));
  const watchdog=setTimeout(finish,8500);
  launchTimers.push(watchdog);
}
document.addEventListener('visibilitychange',()=>document.hidden?resetLaunch():playLaunch());
window.addEventListener('pagehide',resetLaunch);
window.addEventListener('pageshow',playLaunch);
playLaunch();
window.addEventListener('hashchange',()=>location.reload());
</script>
