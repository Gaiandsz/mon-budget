function change(section){tab=section;payForm=null;window.scrollTo(0,0);if(section==='Dettes'&&!draft)makeDraft();render()}
const txMonth=m=>db.transactions.filter(t=>t.date.slice(0,7)===m);
const txIncome=m=>money(txMonth(m).filter(t=>t.type==='revenu').reduce((s,t)=>s+cents(t.amount),0));
const txSpent=m=>money(txMonth(m).filter(t=>t.type==='depense').reduce((s,t)=>s+cents(t.amount),0));
function balance(){return money(cents(db.starting)+db.transactions.filter(t=>t.date<=today()).reduce((s,t)=>s+(t.type==='revenu'?1:-1)*cents(t.amount),0))}
function subscriptionDue(m){return money(db.subscriptions.filter(s=>s.start<=m&&(!s.end||s.end>=m)).reduce((s,x)=>s+cents(x.amount),0))}
function linkedTransactions(planId,paymentId){return db.transactions.filter(t=>t.planId===planId&&t.installmentId===paymentId&&t.type==='depense')}
function installmentPaid(p,pm){return money(linkedTransactions(p.id,pm.id).reduce((s,t)=>s+cents(t.amount),0))}
function remaining(p,pm){return Math.max(0,money(cents(pm.amount)-cents(installmentPaid(p,pm))))}
function duesFor(m,kind='paiement'){return money(db.plans.filter(p=>p.kind===kind).flatMap(p=>p.payments.filter(pm=>pm.month===m).map(pm=>kind==='paiement'?cents(remaining(p,pm)):pm.reserved?0:cents(pm.amount))).reduce((a,x)=>a+x,0))}
function overdueTotal(){return money(db.plans.filter(p=>p.kind==='paiement').flatMap(p=>p.payments.filter(pm=>pm.month<cycleMonth(today())).map(pm=>cents(remaining(p,pm)))).reduce((s,x)=>s+x,0))}
function uiSelect(arr,selected){return arr.map(v=>`<option value="${esc(v)}"${v===selected?' selected':''}>${esc(v)}</option>`).join('')}
function progress(part,whole){return `<div class="bar"><div class="${part>whole?'over':''}" style="width:${whole?Math.min(100,Math.max(0,part/whole*100)):0}%"></div></div>`}
function table(columns, rows) {
  return rows.length ? `<div class="entries">${rows.map(row => `<article class="entry">${[...row.matchAll(/<td(?:\s[^>]*)?>(.*?)<\/td>/gs)].map((cell,i) => `<div><span>${columns[i]}</span>${cell[1]}</div>`).join('')}</article>`).join('')}</div>` : '<p class="muted">Aucune donnée pour le moment.</p>';
}
const navItems = [['Tableau de bord','⌂','Accueil'],['Budgets','◔','Budgets'],['Revenus','↙','Revenus'],['Charges fixes','↗','Charges'],['Dettes','≡','Dettes']];
function render() {
  document.getElementById('tabs').innerHTML = navItems.map(([page, icon, label]) => `<button class="${page===tab?'active':''}" data-action="tab" data-value="${page}" ${page===tab?'aria-current="page"':''}><span aria-hidden="true">${icon}</span>${label}</button>`).join('');
  const pages = {'Tableau de bord':monthlyDashboard,'Revenus':incomePage,'Transactions':transactionsPage,'Budgets':dailyBudgetPage,'Charges fixes':subscriptionsPage,'Dettes':schedulesPage,'Épargne':goalsPage,'Réglages':settingsPage};
  document.getElementById('view').innerHTML = pages[tab]();
  if(tab==='Dettes') updateDraftTotals();
}
function monthPicker(){return `<label class="period-picker">Cycle débutant en <input id="month-filter" type="month" value="${esc(selectedMonth)}"></label>`}
function txTable(items){return table(['Date','Opération','Catégorie','Type','Montant','Actions'],items.map(t=>`<tr><td>${esc(t.date)}</td><td><strong>${esc(t.label)}</strong>${t.planId?'<br><span class="tiny">Liée à un échéancier</span>':''}</td><td>${esc(t.category)}</td><td><span class="pill ${t.type==='revenu'?'blue':''}">${t.type==='revenu'?'Revenu':'Dépense'}</span></td><td class="money ${t.type==='depense'?'negative':''}">${t.type==='revenu'?'+':'−'}${euro(t.amount)}</td><td><div class="row" style="justify-content:flex-end"><button class="ghost small" data-action="edit-tx" data-id="${esc(t.id)}">Modifier</button><button class="danger small" data-action="remove-tx" data-id="${esc(t.id)}">×</button></div></td></tr>`))}
function transactionsPage(){const edit=db.transactions.find(t=>t.id===editTxId),items=(txFilter==='all'?db.transactions:txMonth(txFilter)).slice().sort((a,b)=>b.date.localeCompare(a.date));const cats=[...new Set([...db.categories.map(c=>c.name),'Salaire','Aides','Autres revenus',edit?.category].filter(Boolean))];return `<h2>Transactions</h2><div class="panel"><h3>${edit?'Modifier une opération':'Ajouter une opération réelle'}</h3><form data-form="transaction"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${esc(edit?.date||today())}" required></div><div><label>Libellé</label><input name="label" value="${esc(edit?.label||'')}" placeholder="Ex. Courses" maxlength="140" required></div><div><label>Montant (€)</label><input name="amount" type="number" min="0.01" step="0.01" value="${edit?.amount??''}" required></div><div><label>Type</label><select name="type">${uiSelect(['Dépense','Revenu'],edit?.type==='revenu'?'Revenu':'Dépense')}</select></div><div><label>Catégorie</label><select name="category">${uiSelect(cats,edit?.category)}</select></div></div><div class="row form-buttons"><button type="submit" class="primary">${edit?'Enregistrer les modifications':'Ajouter la transaction'}</button>${edit?'<button type="button" class="ghost" data-action="cancel-tx">Annuler</button>':''}</div></form></div><section class="panel"><div class="space"><h3>Historique (${items.length})</h3><label class="row" style="margin:0">Période <select id="tx-filter" style="width:auto"><option value="all">Toutes</option>${[...new Set(db.transactions.map(t=>t.date.slice(0,7)))].sort().reverse().map(m=>`<option value="${m}" ${txFilter===m?'selected':''}>${m}</option>`).join('')}</select></label></div>${txTable(items)}</section>`}
function saveTx(form){const f=new FormData(form),label=String(f.get('label')||'').trim(),date=normDate(f.get('date')),amount=amountFrom(f.get('amount')),type=f.get('type')==='Revenu'?'revenu':'depense';if(!label||!date||!Number.isFinite(amount)||cents(amount)<=0)return alert('Vérifiez la date, le libellé et le montant positif.');let t=db.transactions.find(x=>x.id===editTxId);if(t){Object.assign(t,{date,label,amount:money(cents(amount)),type,category:String(f.get('category'))});if(t.planId&&type!=='depense'){delete t.planId;delete t.installmentId}}else db.transactions.push({id:uid(),date,label,amount:money(cents(amount)),type,category:String(f.get('category'))});editTxId=null;save('Transaction enregistrée')}
function normalizeCategory(raw) {
  const name = String(raw.name);
  const limit = Math.max(0,Number(raw.limit)||0);
  if (raw.cadence==='weekly' || raw.cadence==='daily') return {name,limit,cadence:raw.cadence};
  if (/course|nourriture|aliment/i.test(name)) return {name,limit:money(cents(limit)*7/30),cadence:'weekly'};
  return {name,limit,cadence:'daily'};
}
function cadenceSelect(cadence) {
  return `<select name="cadence"><option value="daily" ${cadence==='daily'?'selected':''}>Par cycle · disponible chaque jour</option><option value="weekly" ${cadence==='weekly'?'selected':''}>Par semaine · disponible chaque semaine</option></select>`;
}
function budgetsPage() {
  return `<section class="budget-editor">
  ${db.categories.map((c,i)=>`<form class="budget-card" data-form="edit-budget" data-index="${i}"><h3>${categoryIcon(c.name)} ${esc(c.name)}</h3>
    <div class="formgrid"><label>Montant (€)<input name="limit" type="number" required min="0" step="0.01" value="${c.limit}"></label>
    <label>Fréquence${cadenceSelect(c.cadence)}</label></div><div class="row gap-top"><button class="primary small">Enregistrer</button><button type="button" class="ghost small" data-action="remove-category" data-index="${i}">Supprimer</button></div></form>`).join('')}
  <form class="budget-card" data-form="category"><h3>Nouveau budget</h3><label>Nom<input name="name" required maxlength="70" placeholder="Ex. Transport"></label>
  <div class="formgrid"><label>Montant (€)<input name="limit" min="0" step="0.01" type="number" required></label><label>Fréquence${cadenceSelect('daily')}</label></div><p><button class="primary small">Ajouter</button></p></form></section>`;
}
function subscriptionsPage(){const item=db.subscriptions.find(s=>s.id===chargeEdit);return `<div class="toolbar"><h2>Charges fixes</h2>${monthPicker()}</div><details class="panel" ${item?'open':''}><summary>${item?'Modifier la charge fixe':'+ Ajouter une charge'}</summary><form data-form="subscription"><div class="formgrid"><div><label>Nom</label><input name="name" required placeholder="Ex. Loyer" maxlength="120" value="${esc(item?.name)}"></div><div><label>Montant par mois (€)</label><input type="number" name="amount" required min="0.01" step="0.01" value="${item?.amount ?? ''}"></div><div><label>Début</label><input type="month" name="start" value="${esc(item?.start || selectedMonth)}" required></div><div><label>Fin (facultatif)</label><input type="month" name="end" value="${esc(item?.end)}"></div></div><p><button class="primary">${item ? 'Enregistrer' : 'Ajouter la charge fixe'}</button> ${item ? '<button type="button" class="ghost" data-action="cancel-charge">Annuler</button>' : ''}</p></form></details><section class="panel"><h3>Charges récurrentes</h3>${table(['Nom','Montant mensuel','Début','Fin','Actions'],db.subscriptions.map(s=>`<tr><td>${esc(s.name)}</td><td class="money">${euro(s.amount)}</td><td>${esc(s.start)}</td><td>${esc(s.end||'—')}</td><td><button class="ghost small" data-action="edit-charge" data-id="${esc(s.id)}">Modifier</button> <button class="danger small" data-action="remove-sub" data-id="${esc(s.id)}">Supprimer</button></td></tr>`))}<p class="tip">Ces charges sont automatiquement comptées chaque mois dans ton tableau de bord.</p></section>`}
function splitEven(total,count){const val=Math.floor(total/count),extra=total-val*count;return Array.from({length:count},(_,i)=>val+(i<extra?1:0))}
function makeDraft(plan=null){if(plan){editPlanId=plan.id;draft={name:plan.name,kind:plan.kind,category:plan.category||'Autres',amount:money(cents(plan.amount)),count:plan.payments.length,start:plan.payments[0]?.month||currentMonth(),payments:plan.payments.map(pm=>({id:pm.id,amount:money(cents(pm.amount)),reserved:!!pm.reserved})),manual:true};return}editPlanId=null;const count=1,amount=0;draft={name:'',kind:'paiement',category:'Autres',amount,count,start:selectedMonth,payments:splitEven(cents(amount),count).map(c=>({id:uid(),amount:money(c),reserved:false})),manual:false}}
function resizeDraft(next){const n=Math.max(1,Math.min(60,next));if(!draft.manual){const amounts=splitEven(cents(draft.amount),n);draft.payments=amounts.map((c,i)=>({id:draft.payments[i]?.id||uid(),amount:money(c),reserved:draft.payments[i]?.reserved||false}))}else if(n>draft.payments.length){for(let i=draft.payments.length;i<n;i++)draft.payments.push({id:uid(),amount:0,reserved:false})}else draft.payments=draft.payments.slice(0,n);draft.count=n}
function renderDraft(){const categoryChoices=[...new Set([...db.categories.map(c=>c.name),draft.category])];return `<section class="panel"><div class="space"><h3>${editPlanId?'Modifier l’échéancier':'Créer un échéancier'}</h3>${editPlanId?'<button class="ghost small" data-action="new-plan">+ Nouvel échéancier</button>':''}</div><form data-form="plan" id="plan-form"><div class="formgrid"><div><label>Nom de l'achat ou du projet</label><input data-draft="name" value="${esc(draft.name)}" placeholder="Ex. Ordinateur" maxlength="120" required></div><div><label>Nature</label><select data-draft="kind"><option value="paiement" ${draft.kind==='paiement'?'selected':''}>Paiement en plusieurs fois</option><option value="provision" ${draft.kind==='provision'?'selected':''}>Provision / épargne anticipée</option></select></div><div><label>Montant total (€)</label><input data-draft="amount" type="number" min="0.01" max="100000000" step="0.01" value="${draft.amount}" required></div><div><label>Nombre de mois (1 à 60)</label><input data-draft="count" type="number" min="1" max="60" step="1" value="${draft.count}" required></div><div><label>Premier mois</label><input data-draft="start" type="month" value="${esc(draft.start)}" required></div><div><label>Catégorie des débits</label><select data-draft="category">${uiSelect(categoryChoices,draft.category)}</select></div></div>
<div class="space gap-top"><h3>Répartition mois par mois</h3><button type="button" class="ghost small" data-action="split-even">↻ Répartir également</button></div><div id="draft-rows">${draft.payments.map((pm,i)=>`<div class="edit-row"><strong>${esc(monthLabel(monthShift(draft.start,i)))}</strong><div class="edit-row-note muted">Mensualité ${i+1}</div><div><input aria-label="Montant du mois ${i+1}" type="number" min="0" step="0.01" data-payment-index="${i}" value="${pm.amount}" required></div></div>`).join('')}</div><div class="summary" id="draft-summary" aria-live="polite"></div><p class="muted">Modifiez chaque montant librement. Le total doit correspondre exactement au prix, au centime près. Changer les dates ne modifie pas les sommes.</p><div class="row form-buttons"><button type="submit" id="save-plan" class="primary">${editPlanId?'Enregistrer les modifications':'Créer l’échéancier'}</button>${editPlanId?'<button class="ghost" type="button" data-action="cancel-plan">Annuler</button>':''}</div></form></section>`}
function updateDraftTotals(){if(!draft)return;const node=document.getElementById('draft-summary'),button=document.getElementById('save-plan');if(!node||!button)return;const total=draft.payments.reduce((s,p)=>s+cents(p.amount),0),required=cents(draft.amount),diff=required-total,valid=required>0&&draft.count>=1&&draft.count<=60&&draft.start&&draft.payments.length===draft.count&&draft.payments.every(p=>Number.isFinite(p.amount)&&cents(p.amount)>=0)&&diff===0;node.innerHTML=`<span>Prix total : <strong>${euro(draft.amount)}</strong></span><span>Réparti : <strong>${euro(money(total))}</strong></span><span class="${diff===0?'success':'warn'}"><strong>${diff===0?'✓ Répartition équilibrée':(diff>0?'Reste à répartir : ':'Dépassement : ')+euro(Math.abs(money(diff)))}</strong></span>`;button.disabled=!valid}
function paymentStatus(p,pm){if(p.kind==='provision')return pm.reserved?'<span class="pill">Réservé</span>':'<span class="pill blue">À réserver</span>';const paid=installmentPaid(p,pm),left=remaining(p,pm);return left===0?'<span class="pill">Soldé</span>':paid>0?'<span class="pill blue">Partiellement payé</span>':pm.month<cycleMonth(today())?'<span class="pill red">En retard</span>':'<span class="pill amber">À payer</span>'}
function paymentInline(p,pm){if(!payForm||payForm.planId!==p.id||payForm.paymentId!==pm.id)return '';const eligible=db.transactions.filter(t=>t.type==='depense'&&!t.planId).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,150);return `<form class="inline-form" data-form="pay-installment" data-plan="${esc(p.id)}" data-payment="${esc(pm.id)}"><strong>Enregistrer ou associer un paiement</strong><p class="muted">Lier une dépense existante évite de la compter deux fois. Laissez le champ vide pour créer un nouveau débit.</p><div class="formgrid"><div><label>Associer une dépense existante</label><select name="existing"><option value="">— Nouvelle dépense —</option>${eligible.map(t=>`<option value="${esc(t.id)}">${esc(t.date)} · ${esc(t.label)} · ${euro(t.amount)}</option>`).join('')}</select></div><div><label>Date du nouveau débit</label><input name="date" type="date" value="${today()}" required></div><div><label>Montant du nouveau débit (€)</label><input name="amount" type="number" min="0.01" step="0.01" value="${remaining(p,pm)}" required></div></div><div class="row gap-top"><button type="submit" class="primary small">Confirmer le paiement</button><button type="button" class="ghost small" data-action="cancel-pay">Annuler</button></div></form>`}
function renderPlanCard(p){const pTotal=cents(p.amount),paid=p.kind==='paiement'?p.payments.reduce((s,pm)=>s+cents(installmentPaid(p,pm)),0):p.payments.filter(pm=>pm.reserved).reduce((s,pm)=>s+cents(pm.amount),0),due=money(p.payments.reduce((s,pm)=>s+(p.kind==='paiement'?cents(remaining(p,pm)):pm.reserved?0:cents(pm.amount)),0));return `<article class="plan-card"><div class="plan-header"><strong>${esc(p.name)}</strong><span class="pill ${p.kind==='provision'?'blue':''}">${p.kind==='paiement'?'Paiement échelonné':'Provision prévisionnelle'}</span><span class="muted">${p.payments.length} mois</span><span class="plan-amount">${euro(p.amount)}</span></div><div class="space" style="margin:10px 0"><span class="muted">${p.kind==='paiement'?'Montant réellement payé':'Montant déclaré réservé'} : <strong>${euro(money(paid))}</strong></span><span class="muted">Reste : <strong>${euro(due)}</strong></span></div>${progress(money(paid),money(pTotal))}<div class="row gap-top"><button class="ghost small" data-action="edit-plan" data-id="${esc(p.id)}">Modifier les mensualités</button><button class="danger small" data-action="remove-plan" data-id="${esc(p.id)}">Supprimer</button></div><div style="margin-top:14px">${p.payments.map(pm=>{const linked=linkedTransactions(p.id,pm.id),left=remaining(p,pm);return `<div class="installment"><div><strong>${esc(monthLabel(pm.month))}</strong><div class="tiny">${esc(pm.month)}</div></div><div class="installment-main"><strong>${euro(pm.amount)}</strong><span class="muted">${p.kind==='paiement'?(linked.length?euro(installmentPaid(p,pm))+' débité · '+euro(left)+' restant': 'Aucun débit enregistré'):pm.reserved?'Montant déclaré de côté':'Aucune réserve déclarée'}</span></div><div>${paymentStatus(p,pm)}</div><div class="installment-actions">${p.kind==='paiement'?`<button class="small ghost" data-action="open-pay" data-plan="${esc(p.id)}" data-payment="${esc(pm.id)}">+ ${left?'Payer':'Débit'}</button>${linked.map(t=>`<button class="small danger" title="Retirer le lien sans effacer la dépense réelle" data-action="unlink-tx" data-id="${esc(t.id)}">Délier ${euro(t.amount)}</button>`).join('')}`:`<button class="small ${pm.reserved?'ghost':'primary'}" data-action="reserve" data-plan="${esc(p.id)}" data-payment="${esc(pm.id)}">${pm.reserved?'Annuler la réserve':'Marquer réservé'}</button>`}</div></div>${paymentInline(p,pm)}`}).join('')}</div></article>`}
function schedulesPage(){if(!draft)makeDraft();const paymentPlans=db.plans.filter(p=>p.kind==='paiement'),provisionPlans=db.plans.filter(p=>p.kind==='provision');return `<div class="space"><h2>Dettes et échéanciers</h2><span class="muted">${db.plans.length} projet(s) enregistré(s)</span></div><div class="tip"><strong>Deux suivis distincts :</strong> un paiement échelonné représente de vrais débits bancaires (enregistrés uniquement quand vous les confirmez) ; une provision sert à planifier de l'argent à mettre de côté, sans diminuer automatiquement votre solde bancaire.</div><details class="panel plan-editor" ${editPlanId || keepPlanOpen?'open':''}><summary>${editPlanId?'Modifier la dette':'+ Ajouter un échéancier'}</summary>${renderDraft()}</details><section class="panel"><h3>Paiements en plusieurs fois (${paymentPlans.length})</h3>${paymentPlans.map(renderPlanCard).join('')||'<div class="empty">Aucun achat à échéances pour le moment.</div>'}</section><section class="panel"><h3>Provisions et épargne anticipée (${provisionPlans.length})</h3>${provisionPlans.map(renderPlanCard).join('')||'<div class="empty">Aucune provision planifiée.</div>'}</section>`}
function savePlan(){const total=cents(draft.amount),sum=draft.payments.reduce((s,p)=>s+cents(p.amount),0);if(!draft.name.trim()||!monthShift(draft.start,0)||total<=0||draft.count<1||draft.count>60||sum!==total||draft.payments.some(p=>!Number.isFinite(p.amount)||p.amount<0))return alert('Vérifiez le nom, les dates et la somme des mensualités.');const old=db.plans.find(p=>p.id===editPlanId);if(old){const retained=new Set(draft.payments.map(x=>x.id)),lost=old.payments.filter(pm=>!retained.has(pm.id));if(lost.some(pm=>linkedTransactions(old.id,pm.id).length))return alert('Impossible de supprimer une mensualité liée à un paiement réel. Déliez d’abord ce paiement.');if(old.kind!==draft.kind&&old.payments.some(pm=>linkedTransactions(old.id,pm.id).length))return alert('Déliez les dépenses réelles avant de transformer ce plan en provision.')}const id=old?.id||uid();const payments=draft.payments.map((pm,i)=>({id:pm.id||uid(),month:monthShift(draft.start,i),amount:money(cents(pm.amount)),reserved:!!pm.reserved}));const item={id,name:draft.name.trim(),kind:draft.kind,category:draft.category,amount:money(total),payments};if(old)Object.assign(old,item);else db.plans.push(item);makeDraft();keepPlanOpen=false;payForm=null;save(old?'Échéancier modifié':'Échéancier créé')}
function savePayment(form){const f=new FormData(form),p=db.plans.find(x=>x.id===form.dataset.plan),pm=p?.payments.find(x=>x.id===form.dataset.payment);if(!p||!pm||p.kind!=='paiement')return;const existingId=f.get('existing');if(existingId){const tx=db.transactions.find(t=>t.id===existingId);if(!tx||tx.type!=='depense'||tx.planId)return alert('Cette transaction ne peut pas être liée.');tx.planId=p.id;tx.installmentId=pm.id}else{const date=normDate(f.get('date')),amount=amountFrom(f.get('amount'));if(!date||!Number.isFinite(amount)||cents(amount)<=0)return alert('Renseignez une date et un montant positif.');if(cents(amount)>cents(remaining(p,pm))&&!confirm('Ce débit dépasse la mensualité prévue. Continuer ?'))return;db.transactions.push({id:uid(),date,label:p.name,amount:money(cents(amount)),type:'depense',category:p.category||'Autres',planId:p.id,installmentId:pm.id})}payForm=null;save('Paiement lié à l’échéancier et au registre des transactions')}

function normalizeIncome(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter(item => item?.name && monthShift(item.start, 0)).map(item => ({
    id: String(item.id || uid()),
    name: String(item.name),
    kind: ['Salaire', 'Aide', 'Autre'].includes(item.kind) ? item.kind : 'Autre',
    start: item.start,
    amount: Math.max(0, cents(item.amount)) / 100,
    exceptions: Object.fromEntries(Object.entries(item.exceptions || {})
      .filter(([month, amount]) => monthShift(month, 0) && Number.isFinite(amount) && amount >= 0))
  }));
}

function monthlyIncome(month) {
  return db.incomes.filter(item => item.start <= month)
    .reduce((sum, item) => sum + cents(item.exceptions[month] ?? item.amount), 0);
}

const dayNumber = date => Date.parse(date + 'T00:00:00Z') / 86400000;
const dateAtDay = day => new Date(day * 86400000).toISOString().slice(0,10);
function normalizeReceipts(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter(receipt => receipt && monthShift(receipt.month,0) && normDate(receipt.date))
    .map(receipt => ({month:receipt.month,date:normDate(receipt.date)}))
    .sort((a,b)=>a.month.localeCompare(b.month));
}
function dateInMonth(month, day) {
  const [year, number] = month.split('-').map(Number);
  const last = new Date(year, number, 0).getDate();
  return month + '-' + String(Math.min(day,last)).padStart(2,'0');
}
function monthIndex(month) {
  const [year, number] = month.split('-').map(Number);
  return year * 12 + number;
}
function paydayIn(month) {
  const anchor = db.salaryReceipts.findLast(receipt => receipt.month <= month);
  if (!anchor) return dateInMonth(month,db.payday);
  const distance = monthIndex(month) - monthIndex(anchor.month);
  return dateInMonth(monthShift(anchor.date.slice(0,7),distance),Number(anchor.date.slice(8)));
}
function cycleBoundary(month, reference=today()) {
  const latest = db.salaryReceipts.at(-1);
  if (!latest || month <= latest.month) return paydayIn(month);
  const nextMonth = monthShift(latest.month,1);
  const expected = paydayIn(nextMonth);
  if (expected > reference) return paydayIn(month);
  const tomorrow = dateAtDay(dayNumber(reference)+1);
  const distance = monthIndex(month)-monthIndex(nextMonth);
  return dateInMonth(monthShift(tomorrow.slice(0,7),distance),Number(tomorrow.slice(8)));
}
function cycleMonth(date) {
  const reference = today();
  let month = date.slice(0,7);
  while (date < cycleBoundary(month,reference)) month = monthShift(month,-1);
  while (date >= cycleBoundary(monthShift(month,1),reference)) month = monthShift(month,1);
  return month;
}
function cycle(month) {
  const reference = today(), nextMonth = monthShift(month,1);
  const start = cycleBoundary(month,reference), next = cycleBoundary(nextMonth,reference);
  const latest = db.salaryReceipts.at(-1);
  const expected = latest?.month === month ? paydayIn(nextMonth) : next;
  const waiting = latest?.month === month && expected <= reference;
  const days = dayNumber(next)-dayNumber(start);
  const allocationDays = waiting ? dayNumber(expected)-dayNumber(start) : days;
  return {start,next,end:dateAtDay(dayNumber(next)-1),days,allocationDays,waiting,expected};
}
function recordSalary(rawDate, correction=false) {
  const date = normDate(rawDate);
  const latest = db.salaryReceipts.at(-1);
  const previous = db.salaryReceipts.at(-2);
  if (!date || date > today()) return alert('Choisis une date de réception passée ou aujourd’hui.');
  if (latest?.date === date) return;
  const month = latest ? (correction ? latest.month : monthShift(latest.month,1)) : date.slice(0,7);
  const lowerBound = correction ? previous?.date || paydayIn(monthShift(month,-1)) : latest?.date;
  if (lowerBound && date <= lowerBound) return alert('La date doit être après le début du cycle précédent.');
  if (correction && latest) latest.date = date;
  else db.salaryReceipts.push({month,date});
  selectedMonth = month;
  tab = 'Tableau de bord';
  return save('Salaire enregistré');
}
function shortDate(date) {
  return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'}).format(new Date(date+'T12:00:00'));
}
function variableExpenses(period) {
  return db.transactions.filter(t => t.type==='depense' && !t.planId && t.date>=period.start && t.date<period.next);
}
function position(category, expenses, period, date) {
  const elapsed = Math.max(0,Math.min(period.allocationDays,dayNumber(date)-dayNumber(period.start)+1));
  const limit = cents(category.limit), weekly = category.cadence==='weekly';
  const days = period.allocationDays;
  const cap = weekly ? Math.round(limit * days / 7) : limit;
  const released = weekly ? Math.round(limit * Math.min(days,Math.ceil(elapsed/7)*7) / 7) : Math.round(cap * elapsed / days);
  const used = expenses.filter(t => t.category===category.name && t.date<=date).reduce((n,t)=>n+cents(t.amount),0);
  return {cap,released,used,available:released-used,rate:weekly?category.limit:money(cap/days),weekly};
}
function monthBudget(month, period, expenses) {
  const income = monthlyIncome(month), fixed = cents(subscriptionDue(month));
  const scheduled = db.plans.filter(p=>p.kind==='paiement').flatMap(p=>p.payments)
    .filter(p=>p.month===month).reduce((sum,p)=>sum+cents(p.amount),0);
  const arrears = month===cycleMonth(today()) ? cents(overdueTotal()) : 0;
  const variable = db.categories.reduce((sum,c)=>{
    const budget = position(c,expenses,period,period.end);
    return sum + Math.max(budget.cap,budget.used);
  },0)
    + expenses.filter(t=>!db.categories.some(c=>c.name===t.category)).reduce((sum,t)=>sum+cents(t.amount),0);
  return {income,fixed,debt:scheduled+arrears,variable,free:income-fixed-scheduled-arrears-variable};
}
function amountCell(value) {
  return `<strong class="${value<0?'negative':''}">${euro(money(value))}</strong>`;
}
function budgetCards(period, expenses, date, quick=false) {
  const canAdd = quick && date>=period.start && date<period.next && date<=today();
  return db.categories.map((c,index) => {
    const b = position(c,expenses,period,date);
    const content = `<div class="space"><span class="budget-icon" aria-hidden="true">${categoryIcon(c.name)}</span><div class="budget-name"><strong>${esc(c.name)}</strong><small>${euro(b.rate)} / ${b.weekly?'semaine':'jour'}</small></div>${canAdd?'<span class="budget-plus" aria-hidden="true">+</span>':''}</div>
    <div class="budget-available">${amountCell(b.available)} <small>${b.available<0?'de dépassement':'disponibles'}</small></div>
    ${progress(b.used,b.released)}<div class="space caption"><span>${euro(money(b.used))} dépensés</span><span>${euro(money(b.released))} cumulés</span></div>`;
    return canAdd ? `<button type="button" class="budget-card quick-budget" data-action="quick-expense" data-index="${index}" data-date="${date}" aria-label="Ajouter une dépense · ${esc(c.name)} · ${euro(money(b.available))} disponibles">${content}</button>`
      : `<article class="budget-card">${content}</article>`;
  }).join('') || '<p class="muted">Ajoute un budget pour commencer le suivi.</p>';
}
function expenseChoices(name) {
  const icon = categoryIcon(name);
  if (icon==='🛒') return [['🥬','Supermarché'],['🥖','Boulangerie'],['🥡','À emporter']];
  if (icon==='🎟️') return [['🍺','Bar'],['🎬','Cinéma'],['🍕','Restaurant']];
  if (icon==='🚆') return [['🚇','Métro'],['🚕','Taxi'],['⛽','Carburant']];
  return [['☕','Café'],['🛍️','Achats'],['🎁','Cadeau']];
}
function openQuickExpense(index,date) {

  dialog.innerHTML = `<form data-form="quick-expense" data-index="${index}" data-date="${date}">
    <div class="space"><h3 id="quick-expense-title">${categoryIcon(category.name)} ${esc(category.name)}</h3><button type="button" class="ghost" data-action="close-expense" aria-label="Fermer">×</button></div>
    <label for="quick-amount">${date===today()?'Dépensé aujourd’hui':'Dépensé le '+shortDate(date)}</label>
    <div class="quick-amount"><input id="quick-amount" name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="0,00" required><span aria-hidden="true">€</span></div>
    <fieldset class="expense-chips"><legend>Libellé facultatif</legend>
      <label><input type="radio" name="label" value="" checked><span>Sans détail</span></label>
      ${expenseChoices(category.name).map(([icon,label])=>`<label><input type="radio" name="label" value="${label}"><span>${icon} ${label}</span></label>`).join('')}
    </fieldset><button class="primary quick-submit">Ajouter la dépense</button></form>`;
  dialog.showModal();
  dialog.querySelector('#quick-amount').focus();
}
function saveQuickExpense(form, fields) {
  const category = db.categories[Number(form.dataset.index)], date = normDate(form.dataset.date);
  const amount = amountFrom(fields.get('amount'));
  if (!category || !date || date>today() || cycleMonth(date)!==selectedMonth || !Number.isFinite(amount) || cents(amount)<=0) return alert('Vérifie le montant et la date.');
  const chosen = fields.get('label');
  const label = expenseChoices(category.name).some(([,value])=>value===chosen) ? chosen : category.name;
  db.transactions.push({id:uid(),date,label,type:'depense',category:category.name,amount:money(cents(amount))});
  form.closest('dialog').close();
  return save('Dépense enregistrée');
}

  const salaryControl = current ? `<section class="panel salary-panel"><div class="space">
    <div><strong>${period.waiting?'En attente du salaire':'Prochain salaire prévu'}</strong><div class="muted">${shortDate(period.expected)}</div></div>
    <button class="primary" data-action="salary-received" ${latest?.date===today()?'disabled':''}>Salaire reçu</button>
    </div><details><summary>Saisir une autre date de réception</summary>
    <form data-form="new-salary-date"><label>Date de réception<input type="date" name="date" required max="${today()}" value="${today()}"></label><p><button class="primary">Démarrer le cycle</button></p></form></details>
    ${latest?`<button class="ghost small" data-action="tab" data-value="Réglages">Corriger la date du dernier salaire</button>`:''}</section>` : '';
  const elapsed = Math.min(period.days,Math.max(0,dayNumber(date)-dayNumber(period.start)+1));
  const future = Array.from({length:11},(_,i)=>monthShift(selectedMonth,i+1)).map(month=>{
    const next = cycle(month), forecast = monthBudget(month,next,variableExpenses(next));
    return `<div class="forecast-row"><span>${shortDate(next.start)} – ${shortDate(next.end)} <small>${month.slice(0,4)}</small></span>${amountCell(forecast.free)}</div>`;
  }).join('');
  return `<div class="toolbar"><h2>Tableau de bord</h2>${monthPicker()}</div>
  <section class="hero"><div class="space"><span>${shortDate(period.start)} – ${shortDate(period.end)}</span><span>Jour ${elapsed}${period.waiting?'':' / '+period.days}</span></div>
  <div class="hero-amount">${euro(money(p.free))}</div><div>${p.free<0?'Déficit prévu':'Épargne possible en fin de cycle'}</div>
  ${progress(elapsed,period.days)}</section>
  ${salaryControl}<div class="metrics">${[['Revenus',p.income,'Revenus'],['Charges fixes',p.fixed,'Charges fixes'],['Dettes',p.debt,'Dettes'],['Budgets prévus',p.variable,'Budgets']].map(([label,value,page])=>`<button data-action="tab" data-value="${page}"><small>${label}</small>${amountCell(value)}</button>`).join('')}</div>
  <div class="space budget-heading"><h3>${current?'Disponible aujourd’hui':elapsed===0?'Budgets du prochain cycle':'Budgets en fin de cycle'}</h3><button class="ghost small" data-action="tab" data-value="Budgets">Gérer</button></div>
  <div class="budget-stack" id="dashboard-budgets">${budgetCards(period,expenses,date,true)}</div><dialog id="expense-dialog" aria-labelledby="quick-expense-title"></dialog>
  <label class="day-control">Voir le cumul au <output id="day-label">${elapsed?shortDate(date):'début du cycle'}</output><input aria-label="Jour du cycle" id="cycle-day" type="range" min="1" max="${period.days}" value="${Math.max(1,elapsed)}"></label>
  <details class="panel forecast"><summary>Épargne possible sur les cycles suivants</summary>${future}</details>`;
}
function categoryIcon(name) {
  const label = name.toLowerCase();
  if (/course|nourriture|aliment|restaurant/.test(label)) return '🛒';
  if (/loisir|sortie/.test(label)) return '🎟️';
  if (/transport/.test(label)) return '🚆';
  if (/santé/.test(label)) return '✚';
  return '◈';
}

let expenseOpen = false;
let budgetEditorOpen = false;
function dailyBudgetPage() {
  const period = cycle(selectedMonth), date = today()<period.start ? period.start : today()>period.end ? period.end : today();
  const entries = variableExpenses(period);
  return `<div class="toolbar"><h2>Budgets</h2>${monthPicker()}</div>
  <details class="panel" ${expenseOpen?'open':''}><summary>+ Ajouter une dépense</summary><form data-form="daily-expense">
  <label>Catégorie<select name="category" required>${db.categories.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join('')}</select></label>
  <div class="formgrid"><label>Libellé facultatif<input name="label" maxlength="120" placeholder="Ex. Supermarché"></label>
  <label>Montant (€)<input name="amount" type="number" min="0.01" step="0.01" required></label>
  <label>Date<input name="date" type="date" min="${period.start}" max="${period.end}" value="${date}" required></label></div>
  <p><button class="primary" ${db.categories.length?'':'disabled'}>Enregistrer</button></p></form></details>
  <details class="panel" ${budgetEditorOpen?'open':''}><summary>Modifier mes budgets</summary>${budgetsPage()}</details>
  <div class="budget-stack">${budgetCards(period,entries,today())}</div>
  <details class="panel forecast"><summary>Dépenses du cycle (${entries.length})</summary>${txTable(entries.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</details>`;
}
function settingsPage() {
  const latest = db.salaryReceipts.at(-1);
  return `<h2>Réglages</h2><section class="panel"><h3>${latest?'Corriger le dernier salaire reçu':'Saisir la réception du salaire'}</h3>
  <p class="muted">Cette date définit le début du cycle. Les suivants sont prévus le même jour chaque mois, ou le dernier jour si le mois est plus court.</p>
  <form data-form="salary-date"><label>Date de réception<input type="date" name="date" required max="${today()}" value="${latest?.date||today()}"></label><p><button class="primary">Enregistrer</button></p></form></section>
  ${latest?'':`<section class="panel"><h3>Jour habituel du salaire</h3>
  <p class="muted">Le cycle débute ce jour et se termine la veille du salaire suivant. Pour les mois plus courts, le dernier jour du mois s’applique.</p>
  <form data-form="payday"><label>Jour du mois<input type="number" name="day" min="1" max="31" step="1" required value="${db.payday}"></label><p><button class="primary">Enregistrer</button></p></form></section>`}
  <section class="panel"><div class="row"><button class="ghost" data-action="tab" data-value="Transactions">Historique des transactions</button><button class="ghost" data-action="tab" data-value="Épargne">Objectifs d’épargne</button></div></section>`;
}
function saveMonthlyForm(form) {
  const f = new FormData(form);
  const raw = f.get('amount');
  const amount = amountFrom(raw);
  if (!Number.isFinite(amount) || amount < 0) return alert('Vérifiez le montant.');
  if (form.dataset.form === 'recurring-income') {
    const name = String(f.get('name') || '').trim(), start = f.get('start'), kind = f.get('kind');
    if (!name || !monthShift(start,0)) return alert('Vérifiez le libellé et le mois de début.');
    const item = db.incomes.find(i => i.id === incomeEdit);
    if (item) Object.assign(item, {name, start, kind, amount:money(cents(amount))});
    else db.incomes.push({id:uid(),name,start,kind,amount:money(cents(amount)),exceptions:{}});
    incomeEdit = null;
    return save('Revenu enregistré');
  }
  if (form.dataset.form === 'income-exception') {
    const item = db.incomes.find(i => i.id === form.dataset.id);
    if (!item || selectedMonth < item.start) return;
    if (raw === '') delete item.exceptions[selectedMonth];
    else item.exceptions[selectedMonth] = money(cents(amount));
    return save('Revenu du mois mis à jour');
  }
  const category = f.get('category') === null ? null : db.categories[Number(f.get('category'))];
  const date = normDate(f.get('date')), label = String(f.get('label') || '').trim();
  if (!category || !date || cycleMonth(date) !== selectedMonth || cents(amount) <= 0)
    return alert('Vérifiez la catégorie, la date et le montant.');
  db.transactions.push({id:uid(),date,label:label||category.name,type:'depense',category:category.name,amount:money(cents(amount))});
  expenseOpen = false;
  return save('Dépense enregistrée');
}

let keepPlanOpen=false;
const cloudStatus = document.getElementById('cloud-status');
const login = document.getElementById('cloud-login');
const app = document.getElementById('cloud-app');
const signOut = document.getElementById('cloud-logout');
const retry = document.getElementById('cloud-retry');
const reload = document.getElementById('cloud-reload');
const cloud = window.supabase?.createClient(CLOUD_URL, CLOUD_KEY);

let revision = null;
let account = null;
let pending = null;
let busy = false;
let conflict = false;
let generation = 0;

function syncMessage(message) {
  cloudStatus.textContent = message;
}
function updateCloudControls() {
  app.inert = busy || !!pending;
  retry.hidden = busy || !pending || conflict;
  reload.hidden = busy || !pending;
}
function installSharedBudget(data, version) {
  const firstLoad = revision === null;
  const previousCycle = cycleMonth(today());
  db = normalizeData(data);
  revision = version;
  if (firstLoad || selectedMonth === previousCycle) selectedMonth = cycleMonth(today());
  editTxId = incomeEdit = chargeEdit = editPlanId = null;
  payForm = null;
  makeDraft();
  render();
}

async function refreshSharedBudget(epoch=generation) {
  if (!account || busy || pending) return;
  const {data, error} = await cloud.from('mon_budget_partage').select('revision, payload').eq('id',1).maybeSingle();
  if (epoch !== generation || pending || busy) return;
  if (error) {
    syncMessage('Connexion à la base indisponible. Nouvelle tentative automatique.');
    return;
  }
  if (!data) {
    app.hidden = true;
    syncMessage('Ce compte n’a pas accès au budget partagé.');
    return;
  }
  if (revision === null || data.revision > revision) {
    if (revision !== null && (app.querySelector('dialog[open]') || document.activeElement?.closest('#cloud-app form'))) return;
    installSharedBudget(data.payload,data.revision);
  }
  app.hidden = false;
  syncMessage('Budget partagé · synchronisé');
}

function save(message='Enregistré') {
  if (!account || revision === null || pending || busy) return false;
  pending = {payload:clone(db), version:revision, message};
  pushSharedBudget();
  return true;
}
async function pushSharedBudget() {
  if (!pending || busy || conflict) return;
  busy = true;
  updateCloudControls();
  syncMessage('Enregistrement du budget partagé…');
  const epoch = generation;
  try {
    const {data, error} = await cloud.rpc('mon_budget_enregistrer', {
      p_revision:pending.version,
      p_payload:pending.payload,
    });
    if (epoch !== generation) return;
    if (error) throw error;
    if (data === null) {
      conflict = true;
      syncMessage('Une modification a déjà été publiée. Recharge la dernière version, puis ressaisis ta modification.');
      return;
    }
    const message = pending.message;
    revision = data;
    pending = null;
    render();
    syncMessage('Budget partagé · synchronisé');
    if (message) toast(message);
  } catch {
    if (epoch === generation) syncMessage('Enregistrement à confirmer. Réessaie ou recharge le budget partagé.');
  } finally {
    if (epoch === generation) {
      busy = false;
      updateCloudControls();
    }
  }
}

function applySession(session) {
  const id = session?.user?.id ?? null;
  if (id === account) return;
  generation++;
  account = id;
  revision = null;
  pending = null;
  busy = false;
  conflict = false;
  app.hidden = true;
  app.querySelector('dialog[open]')?.close();
  db = normalizeData(clone(DEFAULT_DATA));
  tab = 'Tableau de bord';
  document.getElementById('view').replaceChildren();
  login.hidden = !!id;
  signOut.hidden = !id;
  updateCloudControls();
  if (id) {
    syncMessage('Chargement du budget partagé…');
    void refreshSharedBudget();
  } else syncMessage('Connecte-toi pour ouvrir le budget partagé.');
}
login.addEventListener('submit',async event=>{
  event.preventDefault();
  if (!cloud) return;
  const values = new FormData(login);
  const button = login.querySelector('button');
  button.disabled = true;
  try {
    const {error} = await cloud.auth.signInWithPassword({email:String(values.get('email')).trim(),password:values.get('password')});
    if (error) syncMessage('Connexion refusée. Vérifie tes identifiants.');
    else login.reset();
  } catch {
    syncMessage('Connexion indisponible. Réessaie dans un instant.');
  } finally {
    button.disabled = false;
  }
});
signOut.addEventListener('click',async ()=>{
  if (pending && !confirm('Quitter malgré la modification dont l’enregistrement reste à confirmer ?')) return;
  const {error} = await cloud.auth.signOut({scope:'local'});
  if (error) syncMessage('La déconnexion a échoué. Réessaie.');
});
retry.addEventListener('click',pushSharedBudget);
reload.addEventListener('click',()=>{
  if (!confirm('Recharger la version en ligne et abandonner la modification locale ?')) return;
  pending = null;
  conflict = false;
  app.hidden = true;
  revision = null;
  updateCloudControls();
  void refreshSharedBudget();
});
window.addEventListener('beforeunload',event=>{
  if (pending) {
    event.preventDefault();
    event.returnValue = '';
  }
});
if (cloud) {
  cloud.auth.onAuthStateChange((_event,session)=>setTimeout(()=>applySession(session),0));
  syncMessage('Connecte-toi pour ouvrir le budget partagé.');
  setInterval(()=>{if (!document.hidden) void refreshSharedBudget();},5000);
  document.addEventListener('visibilitychange',()=>{if (!document.hidden) void refreshSharedBudget();});
} else {
  login.hidden = true;
  syncMessage('Le service de connexion est indisponible. Recharge la page.');
}

</script>
</body>
</html>
